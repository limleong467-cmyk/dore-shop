<!DOCTYPE html>
<html>
<head>
  <title>购物车 - Dore Shop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f5f5f5; }

    nav {
      background: #2c3e50;
      padding: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 2rem;
      cursor: pointer;
    }

    nav a:hover { color: #3498db; }

    .nav-right { display: flex; align-items: center; }
    .nav-right span { color: white; margin-right: 2rem; }

    .logout-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .logout-btn:hover { background: #c0392b; }

    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }

    h1 { color: #2c3e50; margin-bottom: 2rem; }

    .cart-content {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
    }

    .cart-items {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid #eee;
    }

    .cart-item:last-child { border-bottom: none; }

    .item-info { flex: 1; }
    .item-name { font-weight: bold; color: #2c3e50; margin-bottom: 0.5rem; }
    .item-price { color: #e74c3c; }

    .item-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .qty-btn {
      background: #ddd;
      border: none;
      width: 30px;
      height: 30px;
      cursor: pointer;
      border-radius: 4px;
    }

    .qty-btn:hover { background: #ccc; }

    .qty-display {
      min-width: 30px;
      text-align: center;
    }

    .remove-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .remove-btn:hover { background: #c0392b; }

    .cart-summary {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      height: fit-content;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #eee;
    }

    .summary-row:last-of-type { border-bottom: none; padding-bottom: 0; }

    .summary-total {
      font-size: 1.5rem;
      font-weight: bold;
      color: #e74c3c;
      text-align: right;
    }

    .checkout-btn {
      width: 100%;
      padding: 1rem;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }

    .checkout-btn:hover { background: #229954; }

    .empty-cart {
      text-align: center;
      padding: 2rem;
      color: #999;
    }

    .back-btn {
      background: #6c757d;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .back-btn:hover { background: #5a6268; }

    .message {
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 4px;
      text-align: center;
    }

    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <nav>
    <div>
      <a href="index.html">🏠 首页</a>
      <a href="cart.html">🛒 购物车</a>
      <a href="orders.html">📋 我的订单</a>
      <a href="admin.html">🔐 管理</a>
    </div>
    <div class="nav-right">
      <span id="userDisplay"></span>
      <button class="logout-btn" id="logoutBtn" style="display: none;">退出登录</button>
    </div>
  </nav>

  <div class="container">
    <h1>🛒 购物车</h1>
    <button class="back-btn" onclick="window.location.href='index.html'">← 继续购物</button>

    <div id="messageDiv"></div>

    <div class="cart-content">
      <div class="cart-items" id="cartItemsContainer">
        <div class="empty-cart">购物车为空 🛒</div>
      </div>

      <div class="cart-summary">
        <div class="summary-row">
          <span>商品数量:</span>
          <span id="itemCount">0</span>
        </div>
        <div class="summary-row">
          <span>小计:</span>
          <span id="subtotal">¥0.00</span>
        </div>
        <div class="summary-row">
          <span class="summary-total">总计: <span id="total">¥0.00</span></span>
        </div>
        <button class="checkout-btn" onclick="checkout()">结账</button>
      </div>
    </div>
  </div>

  <script>
    console.log('=== 购物车页面加载 ===');

    window.addEventListener('load', () => {
      console.log('页面加载完成');
      checkLogin();
      displayCart();
    });

    function checkLogin() {
      const currentUserStr = localStorage.getItem('currentUser');
      console.log('检查登录状态:', currentUserStr);

      if (currentUserStr) {
        try {
          const user = JSON.parse(currentUserStr);
          console.log('用户已登录:', user);
          document.getElementById('userDisplay').textContent = '👤 ' + user.username;
          document.getElementById('logoutBtn').style.display = 'inline-block';
        } catch (e) {
          console.error('用户信息损坏:', e);
          localStorage.removeItem('currentUser');
          redirectToLogin();
        }
      } else {
        redirectToLogin();
      }
    }

    function redirectToLogin() {
      console.log('用户未登录，重定向到首页');
      window.location.href = 'index.html';
    }

    function displayCart() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const container = document.getElementById('cartItemsContainer');

      console.log('购物车数据:', cart);

      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-cart">购物车为空 🛒</div>';
        document.getElementById('itemCount').textContent = '0';
        document.getElementById('subtotal').textContent = '¥0.00';
        document.getElementById('total').textContent = '¥0.00';
        return;
      }

      let html = '';
      let totalAmount = 0;
      let totalQty = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        totalAmount += itemTotal;
        totalQty += item.quantity;

        html += `
          <div class="cart-item">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">¥${item.price.toFixed(2)}</div>
            </div>
            <div class="item-control">
              <button class="qty-btn" onclick="decreaseQty(${index})">-</button>
              <div class="qty-display">${item.quantity}</div>
              <button class="qty-btn" onclick="increaseQty(${index})">+</button>
              <span style="margin: 0 0.5rem;">¥${itemTotal.toFixed(2)}</span>
              <button class="remove-btn" onclick="removeItem(${index})">删除</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById('itemCount').textContent = totalQty;
      document.getElementById('subtotal').textContent = '¥' + totalAmount.toFixed(2);
      document.getElementById('total').textContent = '¥' + totalAmount.toFixed(2);

      console.log('购物车总金额:', totalAmount);
    }

    function increaseQty(index) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (cart[index]) {
        cart[index].quantity += 1;
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCart();
      }
    }

    function decreaseQty(index) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      if (cart[index] && cart[index].quantity > 1) {
        cart[index].quantity -= 1;
        localStorage.setItem('cart', JSON.stringify(cart));
        displayCart();
      }
    }

    function removeItem(index) {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      displayCart();
    }

    async function checkout() {
      const currentUserStr = localStorage.getItem('currentUser');
      const cart = JSON.parse(localStorage.getItem('cart')) || [];

      console.log('开始结账...');
      console.log('用户信息:', currentUserStr);
      console.log('购物车:', cart);

      if (!currentUserStr) {
        document.getElementById('messageDiv').innerHTML = '<div class="message error">❌ 请先登录</div>';
        return;
      }

      if (cart.length === 0) {
        document.getElementById('messageDiv').innerHTML = '<div class="message error">❌ 购物车为空</div>';
        return;
      }

      try {
        const user = JSON.parse(currentUserStr);
        const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

        console.log('用户ID:', user.id);
        console.log('用户名:', user.username);
        console.log('总金额:', totalAmount);

        const orderData = {
          userId: user.id,
          username: user.username,
          items: cart,
          totalAmount: totalAmount
        };

        console.log('发送订单数据到服务器:', orderData);

        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderData)
        });

        console.log('响应状态:', response.status);
        const result = await response.json();
        console.log('响应数据:', result);

        if (result.success) {
          console.log('✅ 订单创建成功!');
          document.getElementById('messageDiv').innerHTML = '<div class="message success">✅ 订单已生成！正在跳转...</div>';

          // 清空购物车
          localStorage.removeItem('cart');

          // 延迟后跳转到订单页面
          setTimeout(() => {
            window.location.href = 'orders.html';
          }, 1500);
        } else {
          console.log('❌ 订单创建失败:', result.message);
          document.getElementById('messageDiv').innerHTML = `<div class="message error">❌ ${result.message}</div>`;
        }
      } catch (err) {
        console.error('结账错误:', err);
        document.getElementById('messageDiv').innerHTML = `<div class="message error">❌ 结账失败：${err.message}</div>`;
      }
    }

    function logout() {
      console.log('用户退出登录');
      localStorage.removeItem('currentUser');
      localStorage.removeItem('cart');
      window.location.href = 'index.html';
    }

    // 退出登录按钮
    document.getElementById('logoutBtn').addEventListener('click', logout);
  </script>
</body>
</html>
