<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Dore Shop</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .register-container {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .register-links {
            text-align: center;
        }

        .register-links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }

        .register-links a:hover {
            text-decoration: underline;
        }

        .error {
            color: #ef4444;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 10px;
            background: #fee2e2;
            border-radius: 6px;
            display: none;
        }

        .success {
            color: #10b981;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 10px;
            background: #d1fae5;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>🛍️ Dore Shop</h1>
        </div>
    </header>

    <div class="register-container">
        <h2>创建新账户</h2>
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" required placeholder="请输入用户名">
            </div>

            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" required placeholder="请输入邮箱">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" required placeholder="请输入密码（至少6位）">
            </div>

            <div class="form-group">
                <label for="confirmPassword">确认密码</label>
                <input type="password" id="confirmPassword" required placeholder="请再次输入密码">
            </div>

            <button type="submit" class="btn-register">注 册</button>
        </form>

        <div class="register-links">
            <span>已有账户？</span>
            <a href="login.html">立即登录</a>
            <span>|</span>
            <a href="index.html">返回首页</a>
        </div>
    </div>

    <!-- ⚠️ 这个很重要！不要漏掉 -->
    <script>
        // 注册表单处理
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registerForm');
            if (form) {
                form.addEventListener('submit', handleRegister);
            }
        });

        function handleRegister(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            // 验证
            if (!username || !email || !password || !confirmPassword) {
                showError(errorMsg, successMsg, '请填写所有字段');
                return;
            }

            if (password.length < 6) {
                showError(errorMsg, successMsg, '密码至少需要6个字符');
                return;
            }

            if (password !== confirmPassword) {
                showError(errorMsg, successMsg, '两次输入的密码不一致');
                return;
            }

            // 检查用户名或邮箱是否已存在
            let users = [];
            const usersData = localStorage.getItem('users');
            if (usersData) {
                users = JSON.parse(usersData);
            }

            if (users.some(u => u.username === username)) {
                showError(errorMsg, successMsg, '用户名已被注册');
                return;
            }

            if (users.some(u => u.email === email)) {
                showError(errorMsg, successMsg, '邮箱已被注册');
                return;
            }

            // 保存新用户
            const newUser = {
                username: username,
                email: email,
                password: password,
                createdAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));

            // 显示成功消息
            errorMsg.style.display = 'none';
            successMsg.textContent = '✅ 注册成功！请登录...';
            successMsg.style.display = 'block';

            // 2秒后跳转
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }

        function showError(errorElement, successElement, message) {
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            successElement.style.display = 'none';
        }
    </script>
</body>
</html>
